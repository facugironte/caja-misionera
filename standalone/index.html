<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Caja Misionera</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    color-scheme: light only;
    --bg: #F6F6FB;
    --surface: #FFFFFF;
    --surface-sunken: #F0F0F7;
    --border: #E6E6F0;
    --text: #1B1B29;
    --text-muted: #6B6B7D;
    --text-faint: #9A9AAC;
    --on-accent: #FFFFFF;
    --shadow: 0 1px 2px rgba(27,27,41,.06), 0 8px 20px rgba(27,27,41,.05);

    --buffet: #D9501F;    --buffet-soft: #FFE8DC;
    --tickets: #6D4CF0;   --tickets-soft: #EDE7FF;
    --entradas: #1D8FC4;  --entradas-soft: #DFF3FC;
    --rifas: #C2337A;     --rifas-soft: #FBE1EE;

    --stock-mucho: #2E9A57;   --stock-mucho-bg: #E3F5E9;
    --stock-medio: #B98A0E;   --stock-medio-bg: #FAF0D6;
    --stock-poco: #C96A1B;    --stock-poco-bg: #FBE6D3;
    --stock-critico: #C93F2B; --stock-critico-bg: #FADCD7;
    --stock-agotado: #5A6460; --stock-agotado-bg: #E6E9E7;
    --stock-sin: #6B6B7D;     --stock-sin-bg: #ECECF2;

    --font-display: "Fredoka", ui-rounded, "Segoe UI", sans-serif;
    --font-body: "Work Sans", -apple-system, "Segoe UI", Roboto, sans-serif;

    --stand-accent: #7C5CFC;
    --stand-soft: #EDE7FF;
  }

  /* Diseño comprometido con modo claro únicamente: no sigue el tema oscuro del sistema. */

  body[data-stand="buffet"]   { --stand-accent: var(--buffet);   --stand-soft: var(--buffet-soft); }
  body[data-stand="tickets"]  { --stand-accent: var(--tickets);  --stand-soft: var(--tickets-soft); }
  body[data-stand="entradas"] { --stand-accent: var(--entradas); --stand-soft: var(--entradas-soft); }
  body[data-stand="rifas"]    { --stand-accent: var(--rifas);    --stand-soft: var(--rifas-soft); }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-body); -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  input { font-family: inherit; }
  ::selection { background: var(--stand-soft); }

  .app { max-width: 900px; margin: 0 auto; min-height: 100dvh; padding-bottom: 28px; }

  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 18px 6px;
  }
  .backbtn {
    width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .backbtn:hover { background: var(--surface-sunken); }
  .topbar-title { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .topbar-mark {
    width: 34px; height: 34px; border-radius: 11px; background: var(--stand-soft); color: var(--stand-accent);
    display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none;
  }
  .topbar-title h1 {
    font-family: var(--font-display); font-weight: 600; font-size: 16.5px; margin: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .topbar-title p {
    margin: 0; font-size: 11.5px; color: var(--text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .topbar-chip {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 11px; white-space: nowrap; flex: none;
  }
  .topbar-chip strong { color: var(--text); font-variant-numeric: tabular-nums; }

  .screen { padding: 10px 18px 8px; }
  .eyebrow {
    font-size: 12px; font-weight: 600; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: .5px; margin: 18px 0 8px;
  }
  .note { padding: 4px 18px 6px; font-size: 13px; color: var(--text-muted); line-height: 1.4; }

  /* ---- Select screen ---- */
  .hero { padding: 34px 18px 6px; text-align: center; }
  .hero-mark { font-size: 40px; }
  .hero h1 {
    font-family: var(--font-display); font-weight: 600; font-size: 23px; margin: 10px 0 2px;
  }
  .hero p { margin: 0; color: var(--text-muted); font-size: 13.5px; }

  .stand-cards { display: grid; gap: 12px; padding: 22px 18px 10px; }
  @media (min-width: 620px) { .stand-cards { grid-template-columns: repeat(3, 1fr); } }
  .stand-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 18px; cursor: pointer; text-align: left; box-shadow: var(--shadow);
    transition: transform .08s ease;
  }
  .stand-card:active { transform: scale(.98); }
  .stand-card:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  @media (min-width: 620px) { .stand-card { flex-direction: column; align-items: flex-start; gap: 10px; } }
  .stand-card .mark {
    width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    font-size: 26px; flex: none;
  }
  .stand-card.c-buffet .mark   { background: var(--buffet-soft);   color: var(--buffet); }
  .stand-card.c-tickets .mark  { background: var(--tickets-soft);  color: var(--tickets); }
  .stand-card.c-entradas .mark { background: var(--entradas-soft); color: var(--entradas); }
  .stand-card.c-rifas .mark    { background: var(--rifas-soft);    color: var(--rifas); }
  .stand-card h2 { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0; }
  .stand-card p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-muted); }
  .stand-card .chev { margin-left: auto; color: var(--text-faint); font-size: 18px; }
  @media (min-width: 620px) { .stand-card .chev { display: none; } }

  /* ---- Menu / list buttons ---- */
  .menu-list { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px 8px; }
  .menu-btn {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 16px; cursor: pointer; text-align: left; box-shadow: var(--shadow);
  }
  .menu-btn:active { transform: scale(.985); }
  .menu-btn:focus-visible { outline: 2px solid var(--stand-accent); outline-offset: 2px; }
  .menu-btn .mark {
    width: 46px; height: 46px; border-radius: 14px; background: var(--stand-soft); color: var(--stand-accent);
    display: flex; align-items: center; justify-content: center; font-size: 22px; flex: none;
  }
  .menu-btn.primary { background: var(--stand-accent); border-color: var(--stand-accent); }
  .menu-btn.primary .mark { background: rgba(255,255,255,.22); color: var(--on-accent); }
  .menu-btn.primary h3, .menu-btn.primary p { color: var(--on-accent); }
  .menu-btn.primary p { opacity: .85; }
  .menu-btn h3 { font-family: var(--font-display); font-weight: 600; font-size: 15.5px; margin: 0; }
  .menu-btn p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-muted); }
  .menu-btn .chev { margin-left: auto; color: var(--text-faint); font-size: 18px; }
  .menu-btn.primary .chev { color: var(--on-accent); opacity: .85; }

  .link-btn {
    border: 0; background: none; color: var(--text-muted); font-weight: 600; font-size: 12.5px;
    cursor: pointer; padding: 6px 4px; display: flex; align-items: center; gap: 4px;
  }
  .link-btn:hover { color: var(--text); }

  .recent-wrap { padding: 6px 18px 4px; }
  .recent-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 18px 0 8px; }

  /* ---- Product grid / cart ---- */
  .product-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px; padding: 12px 18px 6px;
  }
  .tile {
    position: relative; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 11px 12px 10px; text-align: left; cursor: pointer;
    box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
    min-height: 84px; transition: transform .08s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .tile:active { transform: scale(.96); }
  .tile:focus-visible { outline: 2px solid var(--stand-accent); outline-offset: 2px; }
  .tile.flash { border-color: var(--stand-accent); box-shadow: 0 0 0 3px var(--stand-soft); }
  .tile[disabled] { cursor: not-allowed; background: var(--stock-agotado-bg); }
  .tile[disabled] .icon { opacity: .5; filter: grayscale(1); }
  .tile[disabled] .name { color: var(--text-muted); }
  .tile[disabled] .price { color: var(--text-faint); text-decoration: line-through; }
  .tile-head { display: flex; align-items: center; gap: 8px; }
  .tile-head .icon { font-size: 20px; line-height: 1; flex: none; }
  .tile-head .name { flex: 1; min-width: 0; font-weight: 600; font-size: 13.5px; line-height: 1.2; }
  .tile-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }
  .tile-foot .price {
    font-family: var(--font-display); font-weight: 600; font-size: 15px;
    color: var(--stand-accent); font-variant-numeric: tabular-nums;
  }
  .stock-chip {
    flex: none; font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums;
    padding: 2px 8px; border-radius: 999px; line-height: 1.5;
  }
  .tile .cart-badge {
    flex: none; min-width: 20px; height: 20px; padding: 0 6px;
    border-radius: 999px; background: var(--stand-accent); color: var(--on-accent);
    font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
    display: flex; align-items: center; justify-content: center;
  }
  .stock-line {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 999px; align-self: flex-start;
  }
  .stock-line .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .stock-mucho { background: var(--stock-mucho-bg); color: var(--stock-mucho); } .stock-mucho .dot { background: var(--stock-mucho); }
  .stock-medio { background: var(--stock-medio-bg); color: var(--stock-medio); } .stock-medio .dot { background: var(--stock-medio); }
  .stock-poco { background: var(--stock-poco-bg); color: var(--stock-poco); } .stock-poco .dot { background: var(--stock-poco); }
  .stock-critico { background: var(--stock-critico-bg); color: var(--stock-critico); } .stock-critico .dot { background: var(--stock-critico); }
  .stock-agotado { background: var(--stock-agotado-bg); color: var(--stock-agotado); } .stock-agotado .dot { background: var(--stock-agotado); }
  .stock-sin { background: var(--stock-sin-bg); color: var(--stock-sin); } .stock-sin .dot { background: var(--stock-sin); }

  /* Celular: tarjetas de producto más compactas, siempre 2 columnas. */
  @media (max-width: 480px) {
    .product-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 10px 12px 4px; }
    .tile { min-height: 0; padding: 9px 10px 8px; border-radius: 12px; gap: 6px; }
    .tile-head { gap: 6px; }
    .tile-head .icon { font-size: 17px; }
    .tile-head .name { font-size: 12px; line-height: 1.15; }
    .tile-foot .price { font-size: 13px; }
    .stock-chip { font-size: 11px; padding: 1px 6px; }
    .tile .cart-badge { min-width: 18px; height: 18px; font-size: 10.5px; }
  }

  .cart-list { display: flex; flex-direction: column; gap: 8px; padding: 6px 18px 4px; }
  .cart-line {
    display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 10px 12px;
  }
  .cart-line .icon { font-size: 19px; flex: none; }
  .cart-line .name { flex: 1; font-weight: 600; font-size: 13.5px; }
  .cart-line .sub { font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .cart-line .stepper { display: flex; align-items: center; gap: 6px; }
  .qty-btn {
    border: 1px solid var(--border); background: var(--surface-sunken); color: var(--text);
    width: 40px; height: 40px; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: 600; flex: none;
  }
  .stock-num { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13.5px; min-width: 22px; text-align: center; }

  .checkout-bar {
    position: sticky; bottom: 0; z-index: 15; margin-top: 10px;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    box-shadow: 0 -6px 16px rgba(27,27,41,.06);
  }
  .checkout-bar .info { display: flex; flex-direction: column; line-height: 1.25; }
  .checkout-bar .info .n { font-size: 11.5px; color: var(--text-muted); font-weight: 600; }
  .checkout-bar .info .t { font-family: var(--font-display); font-weight: 600; font-size: 19px; font-variant-numeric: tabular-nums; }
  .checkout-bar button.go {
    border: 0; border-radius: 12px; padding: 13px 22px; font-family: var(--font-display);
    font-weight: 600; font-size: 14.5px; background: var(--stand-accent); color: var(--on-accent);
    cursor: pointer; white-space: nowrap;
  }
  .checkout-bar button.go:disabled { opacity: .45; cursor: not-allowed; }

  .pay-row {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 4px 18px 6px;
  }
  .pay-opt {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px;
    padding: 12px 10px; cursor: pointer; text-align: center;
    font-family: var(--font-display); font-weight: 600; font-size: 13.5px; color: var(--text);
    transition: border-color .12s ease, background .12s ease, transform .08s ease;
  }
  .pay-opt:active { transform: scale(.985); }
  .pay-opt .ic { font-size: 17px; }
  .pay-opt.sel { border-color: var(--stand-accent); background: var(--stand-soft); color: var(--stand-accent); }

  /* ---- Resumen screen ---- */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 10px; padding: 10px 18px 4px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px;
  }
  .stat .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; color: var(--text-faint); }
  .stat .value { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .stat.total { background: var(--stand-accent); border-color: var(--stand-accent); }
  .stat.total .label { color: rgba(255,255,255,.8); }
  .stat.total .value { color: var(--on-accent); font-size: 24px; }

  .op-list { display: flex; flex-direction: column; gap: 8px; padding: 6px 18px 10px; }
  .op-empty { font-size: 13px; color: var(--text-faint); padding: 18px 4px; text-align: center; }
  .op-row {
    display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 10px 12px;
  }
  .op-row .time { font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; width: 46px; flex: none; }
  .op-row .desc { flex: 1; font-size: 13px; font-weight: 500; }
  .op-row .desc small { display: block; color: var(--text-muted); font-weight: 400; font-size: 11.5px; }
  .op-row.voided .desc { text-decoration: line-through; color: var(--text-faint); }
  .op-row .void-btn {
    border: 1px solid var(--border); background: none; color: var(--stock-critico); font-size: 11.5px;
    font-weight: 600; padding: 5px 9px; border-radius: 999px; cursor: pointer; flex: none;
  }

  .close-corte-wrap { padding: 12px 18px 4px; }
  .btn-block {
    width: 100%; border: 0; border-radius: 14px; padding: 14px; cursor: pointer;
    font-family: var(--font-display); font-weight: 600; font-size: 14.5px;
    background: var(--stand-accent); color: var(--on-accent);
  }
  .btn-block:hover { filter: brightness(.94); }

  /* ---- Seteo screen ---- */
  .mini-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .mini-toggle .lbl { font-size: 12.5px; font-weight: 600; color: var(--text-muted); }
  .no-control-note { font-size: 12px; color: var(--text-faint); }
  .switch {
    width: 44px; height: 26px; border-radius: 999px; border: 0; cursor: pointer; position: relative;
    background: var(--stock-agotado-bg); flex: none;
  }
  .switch[data-on="true"] { background: var(--stock-mucho); }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
    background: #fff; transition: transform .15s ease;
  }
  .switch[data-on="true"]::after { transform: translateX(18px); }
  .switch-sm { width: 34px; height: 20px; flex: none; }
  .switch-sm::after { width: 16px; height: 16px; top: 2px; left: 2px; }
  .switch-sm[data-on="true"]::after { transform: translateX(14px); }

  .set-row {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 10px 12px; margin: 0 18px 8px; display: flex; flex-direction: column; gap: 6px;
  }
  .set-row .head { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
  .set-row .icon { font-size: 20px; flex: none; line-height: 1.3; }
  .set-row .name { font-weight: 600; font-size: 14px; flex: 1; }
  .set-row .name-stock { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; flex: 1; min-width: 0; padding-top: 2px; }
  .set-row .price-display, .set-row .expand-chev { margin-top: 2px; }
  .set-row .name-stock .name { flex: none; }
  .set-row .price-display {
    font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--stand-accent);
    font-variant-numeric: tabular-nums; flex: none;
  }
  .set-row .expand-chev { color: var(--text-faint); font-size: 12px; flex: none; width: 14px; text-align: center; }
  .set-row .stock-edit { padding-top: 8px; margin-top: 2px; border-top: 1px solid var(--border); }
  .set-row .stock-edit .mini-toggle { justify-content: flex-start; }
  .set-row .stock-edit .mini-toggle .lbl { flex: none; width: 150px; }
  .set-row .price-field {
    display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text-muted); flex: none;
  }
  .set-row .price-field input {
    width: 88px; border: 1px solid var(--border); border-radius: 9px; padding: 5px 7px;
    font-size: 16px; background: var(--surface-sunken); color: var(--text); text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .set-row .stock-controls { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .qty-group { display: flex; align-items: center; gap: 8px; }
  .qty-num-input {
    width: 56px; height: 40px; border: 1px solid var(--border); border-radius: 10px; padding: 0 4px;
    font-size: 15px; background: var(--surface-sunken); color: var(--text); text-align: center;
    font-variant-numeric: tabular-nums; flex: none;
  }
  .cash-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin: 8px 18px 20px; }
  .cash-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13.5px; }
  .cash-row .k { color: var(--text-muted); }
  .cash-row .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .cash-input-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0 4px; }
  .cash-input-row input {
    width: 130px; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px;
    font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; background: var(--surface-sunken); color: var(--text);
  }
  .cash-result {
    margin-top: 10px; padding: 10px 12px; border-radius: 12px; font-weight: 600; font-size: 13.5px;
    display: flex; align-items: center; gap: 8px;
  }

  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(8px);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
    font-size: 13px; font-weight: 500; box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease; z-index: 40; max-width: 88vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- Login / identificación de puesto ---- */
  .field-label {
    display: block; font-size: 12.5px; font-weight: 600; color: var(--text-muted); margin-top: 12px;
  }
  .field-label:first-child { margin-top: 0; }
  .field-label input {
    width: 100%; margin-top: 5px; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 11px; font-size: 16px; background: var(--surface-sunken); color: var(--text);
    font-family: inherit;
  }
  .field-label input:focus-visible { outline: 2px solid var(--stand-accent); outline-offset: 1px; }

  /* ---- Indicador de sincronización pendiente ---- */
  .sync-badge {
    position: fixed; top: 64px; right: 10px; z-index: 45; display: none; align-items: center; gap: 6px;
    max-width: calc(100vw - 20px);
    background: var(--stock-medio-bg); color: var(--stock-medio); border: 1px solid var(--stock-medio-bg);
    font-size: 11.5px; font-weight: 700; padding: 7px 12px; border-radius: 999px; cursor: pointer;
    box-shadow: var(--shadow);
  }
  .sync-badge:hover { filter: brightness(.97); }

  @media (prefers-reduced-motion: reduce) {
    .tile, .stand-card, .menu-btn, .switch::after, .pay-opt { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="sync-badge" id="syncBadge"></div>

<script>
"use strict";

var fmt = new Intl.NumberFormat("es-AR");
function money(n) { return "$" + fmt.format(Math.round(n)); }

function pad2(n) { return (n < 10 ? "0" : "") + n; }

function nowLabel() {
  var d = new Date();
  return pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}

function slugify(s) {
  return String(s || "").trim().toLowerCase()
    .normalize("NFD").replace(new RegExp("[\\u0300-\\u036f]", "g"), "")
    .replace(/[^a-z0-9]+/g, "-").replace(/(^-+|-+$)/g, "");
}

// Id corto y único para agrupar (ej. las líneas de una misma venta).
function makeId(prefix) {
  return (prefix ? prefix + "-" : "") + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6);
}

"use strict";

function levelFor(stock, t) {
  if (stock <= 0) return "agotado";
  if (stock >= t.mucho) return "mucho";
  if (stock >= t.medio) return "medio";
  if (stock >= t.poco) return "poco";
  return "critico";
}
var LEVEL_LABEL = { mucho: "MUCHO", medio: "MEDIO", poco: "POCO", critico: "CRÍTICO", agotado: "AGOTADO" };
var LEVEL_ORDER = { mucho: 4, medio: 3, poco: 2, critico: 1, agotado: 0 };
var PAY_ICON = { efectivo: "💵", transferencia: "📲", tarjeta: "💳", otro: "🙏" };

// Stock compartido (ingrediente / recurso, ej. "Hamburguesa", "Bebida") del que
// descuentan uno o varios productos vendibles. `controlled` (por defecto true) se
// puede apagar desde la pantalla Stock: los combos que lo usan dejan de descontar
// de él y de limitarse por él.
function pool(id, icon, name, opts) {
  opts = opts || {};
  return {
    id: id, icon: icon, name: name,
    controlled: true, approxLabel: null,
    stock: opts.stock || 0,
    thresholds: opts.thresholds || { mucho: 100, medio: 40, poco: 10 }
  };
}

// Producto vendible (botón). `recipe` mapea id de pool -> unidades que descuenta por venta;
// si tiene recipe, el stock sale de los pools. `controlled` es el modo de stock propio
// (productos sin receta, ej. Café/Té/Torta). El control de stock de un combo se maneja
// en cada pool que usa (pool.controlled), no en el combo.
function product(id, icon, name, price, opts) {
  opts = opts || {};
  return {
    id: id, icon: icon, name: name, price: price,
    recipe: opts.recipe || null,
    controlled: !!opts.controlled,
    stock: opts.stock || 0,
    thresholds: opts.thresholds || { mucho: 100, medio: 40, poco: 10 },
    approxLabel: opts.approxLabel || null,
    sold: 0
  };
}

var STANDS = {
  buffet: {
    label: "Buffet", sub: "Comidas y bebidas", icon: "🍔", food: true,
    pools: [
      pool("chori", "🌭", "Choripán", { stock: 150, thresholds: { mucho: 100, medio: 50, poco: 20 } }),
      pool("hamb", "🍔", "Hamburguesa", { stock: 150, thresholds: { mucho: 100, medio: 50, poco: 20 } }),
      pool("hambveg", "🥬", "Hamburguesa veggie", { stock: 60, thresholds: { mucho: 40, medio: 20, poco: 8 } }),
      pool("bebida", "🥤", "Bebida", { stock: 200, thresholds: { mucho: 140, medio: 70, poco: 25 } })
    ],
    products: [
      product("chori_beb", "🌭", "Choripán + bebida", 10000, { recipe: { chori: 1, bebida: 1 } }),
      product("chori2_beb", "🌭", "2 choripán + bebida", 18000, { recipe: { chori: 2, bebida: 1 } }),
      product("hamb_beb", "🍔", "Hamburguesa + bebida", 10000, { recipe: { hamb: 1, bebida: 1 } }),
      product("hamb2_beb", "🍔", "2 hamburguesa + bebida", 18000, { recipe: { hamb: 2, bebida: 1 } }),
      product("hambveg_beb", "🥬", "Hamburguesa veggie + bebida", 10000, { recipe: { hambveg: 1, bebida: 1 } }),
      product("hambveg2_beb", "🥬", "2 hamburguesa veggie + bebida", 18000, { recipe: { hambveg: 2, bebida: 1 } }),
      product("bebida", "🥤", "Bebida", 1000, { recipe: { bebida: 1 } }),
      product("cafe", "☕", "Café", 1000, { controlled: true, stock: 100, thresholds: { mucho: 60, medio: 30, poco: 10 } }),
      product("te", "🍵", "Té", 1000, { controlled: true, stock: 60, thresholds: { mucho: 40, medio: 20, poco: 8 } }),
      product("torta", "🍰", "Torta", 3000, { controlled: true, stock: 40, thresholds: { mucho: 30, medio: 15, poco: 5 } })
    ]
  },
  tickets: {
    label: "Tickets", sub: "Fichas para juegos", icon: "🎟️",
    products: [
      product("juego1", "🎯", "1 juego", 1000),
      product("tira5", "🎟️", "1 tira (5)", 3000),
      product("tira10", "🎫", "2 tiras (10)", 5000)
    ]
  },
  entradas: {
    label: "Entradas", sub: "Acceso al evento", icon: "🎪",
    products: [
      product("entpuerta", "🎫", "Entrada en puerta", 2000)
    ]
  },
  rifas: {
    label: "Rifas", sub: "Números para el sorteo", icon: "🍀",
    pools: [
      pool("rifa", "🎟️", "Rifa", { stock: 1000, thresholds: { mucho: 500, medio: 200, poco: 50 } })
    ],
    products: [
      product("rifa1", "🎟️", "1 rifa", 4000, { recipe: { rifa: 1 } }),
      product("rifa3", "🍀", "3 rifas", 10000, { recipe: { rifa: 3 } })
    ]
  }
};

// Los id internos ("transferencia", "otro") se mantienen fijos (columnas del Sheet,
// totals/cumulative); solo cambian etiquetas y en qué puestos se ofrecen.
//   - "transferencia": etiqueta visible "QR".
//   - "tarjeta": foodOnly -> solo en puestos con food:true.
//   - "otro" ("Consumo misionero"): stands -> solo en los puestos listados.
var PAY_METHODS = [
  { id: "efectivo", label: "Efectivo" },
  { id: "transferencia", label: "QR" },
  { id: "tarjeta", label: "Tarjeta", foodOnly: true },
  { id: "otro", label: "Consumo misionero", stands: ["buffet"] }
];

// Métodos de pago disponibles en un puesto dado.
function payMethodsFor(standKey) {
  var s = STANDS[standKey] || {};
  return PAY_METHODS.filter(function (m) {
    if (m.stands) return m.stands.indexOf(standKey) >= 0;
    if (m.foodOnly) return !!s.food;
    return true;
  });
}

"use strict";

// Subir cuando cambia la forma del estado persistido de forma incompatible
// (ej. catálogo de productos / pools de stock). Estados guardados con otro
// número se descartan y se arranca de cero.
var STATE_SCHEMA = 5;

function freshStandState(key) {
  return {
    schema: STATE_SCHEMA,
    corte: 1,
    setupDone: false,
    cajaInicial: 0,
    corteApertura: null,
    corteCajaInicial: 0,
    totals: { ventas: 0, efectivo: 0, transferencia: 0, tarjeta: 0, otro: 0 },
    cumulative: { ventas: 0, efectivo: 0, transferencia: 0, tarjeta: 0, otro: 0, retirado: 0 },
    log: [],
    counted: null,
    pools: (STANDS[key].pools || []).map(function (p) {
      return Object.assign({}, p, { level: levelFor(p.stock, p.thresholds) });
    }),
    products: STANDS[key].products.map(function (p) {
      return Object.assign({}, p, { level: levelFor(p.stock, p.thresholds) });
    })
  };
}

function validPersistedState(o) { return !!o && o.schema === STATE_SCHEMA; }

var state = {};
Object.keys(STANDS).forEach(function (key) {
  state[key] = freshStandState(key);
});

function stateKey(tipo, identificador) {
  return "cajaMisioneraState:" + tipo + ":" + slugify(identificador);
}
function saveState() {
  if (!session || !nav.stand) return;
  try { localStorage.setItem(stateKey(session.tipo, session.identificador), JSON.stringify(state[nav.stand])); } catch (e) {}
}
function loadState(tipo, identificador) {
  try {
    var raw = localStorage.getItem(stateKey(tipo, identificador));
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function clearState(tipo, identificador) {
  try { localStorage.removeItem(stateKey(tipo, identificador)); } catch (e) {}
}

"use strict";

var SESSION_KEY = "cajaMisioneraSession";
var session = null;
try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (e) { session = null; }
if (session && !STANDS[session.tipo]) session = null;

function saveSession() { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }

function puestoToken() {
  if (!session) return "";
  return session.tipo + ":" + slugify(session.identificador);
}

"use strict";

var SYNC_URL_KEY = "cajaMisioneraWebAppUrl";
var SYNC_QUEUE_KEY = "cajaMisioneraPendingSync";
var syncing = false;
var DEFAULT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx2OcRP71M0H5E5feartLBC0-LCddaCGUToNzVOhj74Gi5oUQFTWQysqs3ckShF8Sg/exec";

function getWebAppUrl() {
  var stored = localStorage.getItem(SYNC_URL_KEY);
  return stored === null ? DEFAULT_WEB_APP_URL : stored;
}
function setWebAppUrl(url) {
  if (url) localStorage.setItem(SYNC_URL_KEY, url);
  else localStorage.removeItem(SYNC_URL_KEY);
}

function loadQueue() {
  try { return JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || "[]"); } catch (e) { return []; }
}
function saveQueue(q) { localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(q)); updateSyncBadge(); }
function pendingCount() { return loadQueue().length; }

function enqueuePayload(payload) {
  var q = loadQueue();
  q.push(payload);
  saveQueue(q);
}

function sendOne(payload) {
  var url = getWebAppUrl();
  if (!url) return Promise.reject(new Error("sin-url"));
  return fetch(url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(function (res) {
    if (!res.ok) throw new Error("http-" + res.status);
    return res.json().catch(function () { return {}; });
  }).then(function (data) {
    if (data && data.ok === false) throw new Error(data.error || "rechazado");
    return true;
  });
}

function flushQueue() {
  if (syncing) return Promise.resolve();
  var q = loadQueue();
  if (!q.length) return Promise.resolve();
  syncing = true;
  return sendOne(q[0]).then(function () {
    var q2 = loadQueue();
    q2.shift();
    saveQueue(q2);
    syncing = false;
    return q2.length ? flushQueue() : null;
  }).catch(function () {
    syncing = false;
  });
}

function updateSyncBadge() {
  var n = pendingCount();
  var el = document.getElementById("syncBadge");
  if (el) {
    if (n > 0) {
      el.style.display = "flex";
      el.textContent = "🔄 " + n + " corte" + (n === 1 ? "" : "s") + " sin sincronizar";
    } else {
      el.style.display = "none";
    }
  }
  var lbl = document.getElementById("pendingCountLbl");
  if (lbl) lbl.textContent = n;
}

window.addEventListener("online", flushQueue);
setInterval(flushQueue, 20000);

// Filas de movimiento de stock para los items de una venta/anulación.
// Combos (con receta) -> una fila por ingrediente; productos con stock propio -> una fila.
function stockRowsForSale_(st, corteId, op, sign, tipo, motivo) {
  var rows = [];
  var base = {
    timestamp: op.time, puesto_tipo: session.tipo, puesto_id: session.identificador,
    voluntario: session.voluntario, corte_id: corteId, tipo: tipo, motivo: motivo,
    venta_id: (op.id || op.ventaId || ""), stock_resultante: ""
  };
  op.items.forEach(function (it) {
    var p = (st.products || []).filter(function (x) { return x.id === it.productId; })[0];
    if (!p) return;
    if (p.recipe) {
      Object.keys(p.recipe).forEach(function (poolId) {
        var pool = (st.pools || []).filter(function (x) { return x.id === poolId; })[0];
        if (pool && !pool.controlled) return;
        rows.push(Object.assign({}, base, { item: pool ? pool.name : poolId, delta: sign * p.recipe[poolId] * it.qty }));
      });
    } else if (p.controlled) {
      rows.push(Object.assign({}, base, { item: p.name, delta: sign * it.qty }));
    }
  });
  return rows;
}

function buildCortePayload(st, contado, esperado, diferencia, cierreTime, retiro, queda) {
  var corteId = slugify(session.identificador) + "-corte" + st.corte + "-" + Date.now();

  var detalleVentas = [];
  var movimientosStock = [];

  st.log.forEach(function (op) {
    if (op.type === "venta") {
      var estado = op.voided ? "anulada" : "activa";
      op.items.forEach(function (it) {
        detalleVentas.push({
          timestamp: op.time, venta_id: op.id || "",
          puesto_tipo: session.tipo, puesto_id: session.identificador, voluntario: session.voluntario,
          corte_id: corteId, producto: it.name, cantidad: it.qty,
          precio_unitario: it.price, subtotal: it.price * it.qty,
          metodo_pago: op.payMethod, estado: estado, total_venta: op.total
        });
      });
      movimientosStock = movimientosStock.concat(stockRowsForSale_(st, corteId, op, -1, "venta", "Venta"));
    } else if (op.type === "anulacion") {
      movimientosStock = movimientosStock.concat(stockRowsForSale_(st, corteId, op, 1, "anulacion_venta", "Anulación de venta"));
    } else if (op.type === "reposicion") {
      movimientosStock.push({
        timestamp: op.time, puesto_tipo: session.tipo, puesto_id: session.identificador,
        voluntario: session.voluntario, corte_id: corteId,
        tipo: op.delta < 0 ? "ajuste_resta" : "ajuste_suma",
        item: op.name, delta: op.delta, stock_resultante: op.stockResultante,
        venta_id: "", motivo: op.delta < 0 ? "Ajuste manual (resta)" : "Ajuste manual (suma)"
      });
    }
  });

  var cierre = cierreRow_("corte", st, cierreTime, {
    corte_id: corteId, apertura: st.corteApertura,
    cant_cortes: "", cant_ventas: st.totals.ventas, totals: st.totals,
    caja_inicial: st.corteCajaInicial, efectivo_esperado: esperado,
    efectivo_contado: contado, diferencia: diferencia,
    efectivo_retirado: retiro, efectivo_final: queda
  });

  return { token: puestoToken(), corte_id: corteId, detalleVentas: detalleVentas, movimientosStock: movimientosStock, cierre: cierre };
}

function buildCierrePuestoPayload(st, contado, retiro, cierreTime) {
  return cierreRow_("puesto", st, cierreTime, {
    corte_id: "", apertura: session.inicio,
    cant_cortes: st.corte, cant_ventas: st.cumulative.ventas, totals: st.cumulative,
    caja_inicial: st.cajaInicial, efectivo_esperado: "",
    efectivo_contado: contado, diferencia: "",
    efectivo_retirado: retiro, efectivo_final: 0
  });
}

// Fila común de la pestaña "Cierres" (sirve para el cierre de un corte y para el cierre final del puesto).
function cierreRow_(tipoCierre, st, cierreTime, o) {
  var t = o.totals;
  return {
    timestamp: cierreTime, tipo_cierre: tipoCierre,
    puesto_tipo: session.tipo, puesto_id: session.identificador, voluntario: session.voluntario,
    corte_id: o.corte_id, apertura: o.apertura, cierre: cierreTime,
    cant_cortes: o.cant_cortes, cant_ventas: o.cant_ventas,
    monto_efectivo: t.efectivo, monto_transferencia: t.transferencia,
    monto_tarjeta: t.tarjeta, monto_otro: t.otro,
    monto_total_vendido: t.efectivo + t.transferencia + t.tarjeta + t.otro,
    caja_inicial: o.caja_inicial, efectivo_esperado: o.efectivo_esperado,
    efectivo_contado: o.efectivo_contado, diferencia: o.diferencia,
    efectivo_retirado: o.efectivo_retirado, efectivo_final: o.efectivo_final
  };
}

"use strict";

function h(tag, attrs, html) {
  var s = "<" + tag;
  for (var k in attrs) s += " " + k + '="' + attrs[k] + '"';
  s += ">" + (html || "") + "</" + tag + ">";
  return s;
}

function stockLine(p) {
  if (!p.controlled) return '<span class="stock-line stock-sin"><span class="dot"></span>Sin control</span>';
  var lbl = LEVEL_LABEL[p.level];
  var text = p.approxLabel ? p.approxLabel(p.stock) : (p.level === "agotado" ? "Agotado" : ("Stock: " + p.stock));
  return '<span class="stock-line stock-' + p.level + '"><span class="dot"></span>' + text + " · " + lbl + "</span>";
}

function payLabel(id) {
  var m = PAY_METHODS.filter(function (x) { return x.id === id; })[0];
  return m ? m.label : id;
}

function itemsSummary(items) {
  return items.map(function (it) { return it.name + (it.qty > 1 ? " ×" + it.qty : ""); }).join(", ");
}

function opRowHtml(op, idx, allowVoid) {
  if (op.type === "venta") {
    return '<div class="op-row' + (op.voided ? " voided" : "") + '">' +
      '<span class="time">' + op.time + "</span>" +
      '<span class="desc">' + itemsSummary(op.items) + " · " + money(op.total) + "<small>" + payLabel(op.payMethod) + "</small></span>" +
      (allowVoid && !op.voided ? '<button class="void-btn" data-void="' + idx + '">Anular</button>' : "") +
      "</div>";
  }
  if (op.type === "anulacion") {
    return '<div class="op-row"><span class="time">' + op.time + '</span><span class="desc">↩ Venta anulada · ' +
      itemsSummary(op.items) + " · -" + money(op.total) + "</span></div>";
  }
  if (op.type === "reposicion") {
    var stockInfo = op.stockResultante === undefined ? "" : " (" + op.stockResultante + ")";
    return '<div class="op-row"><span class="time">' + op.time + '</span><span class="desc">↑ Reposición · ' +
      op.name + " " + (op.delta > 0 ? "+" : "") + op.delta + stockInfo + "</span></div>";
  }
  return "";
}

function header(title, sub, chipHtml, noBack) {
  var standDef = nav.stand ? STANDS[nav.stand] : null;
  return (
    '<div class="topbar">' +
      (noBack ? "" : '<button class="backbtn" id="backBtn" aria-label="Volver">←</button>') +
      '<div class="topbar-title">' +
        (standDef ? '<div class="topbar-mark">' + standDef.icon + "</div>" : "") +
        "<div><h1>" + title + "</h1>" + (sub ? "<p>" + sub + "</p>" : "") + "</div>" +
      "</div>" +
      (chipHtml || "") +
    "</div>"
  );
}

function chipCorte(st) {
  var total = st.totals.efectivo + st.totals.transferencia + st.totals.tarjeta + st.totals.otro;
  return '<div class="topbar-chip">Corte <strong>' + st.corte + "</strong> · " + money(total) + "</div>";
}

function stat(label, value) {
  return '<div class="stat"><div class="label">' + label + '</div><div class="value">' + value + "</div></div>";
}

"use strict";

function renderLogin() {
  var html = "";
  html += h("div", { class: "hero" },
    '<div class="hero-mark">⛺</div>' +
    "<h1>Caja Misionera</h1>" +
    "<p>Kermesse Familiar · Grupo Misionero — Colegio</p>"
  );
  var tipo = nav.loginTipo;
  if (!tipo) {
    html += '<div class="eyebrow" style="padding-left:18px;">¿Qué puesto vas a operar?</div>';
    html += '<div class="stand-cards">';
    Object.keys(STANDS).forEach(function (key) {
      var s = STANDS[key];
      html += h("button", { class: "stand-card c-" + key, "data-stand": key },
        '<div class="mark">' + s.icon + "</div>" +
        "<div><h2>" + s.label + "</h2><p>" + s.sub + "</p></div>" +
        '<span class="chev">›</span>'
      );
    });
    html += "</div>";
    root.innerHTML = html;
    root.querySelectorAll(".stand-card").forEach(function (btn) {
      btn.addEventListener("click", function () {
        nav.loginTipo = btn.getAttribute("data-stand");
        render();
      });
    });
    return;
  }

  var s = STANDS[tipo];
  html += '<div class="eyebrow" style="padding-left:18px;">Identificá tu puesto</div>';
  html += '<div class="set-row" style="margin:0 18px 10px;">' +
    '<div class="head"><span class="icon">' + s.icon + '</span><span class="name">' + s.label + '</span></div>' +
    '<label class="field-label">Identificador del puesto' +
    '<input type="text" id="loginId" placeholder="Ej. ' + s.label + ' 1" maxlength="40"></label>' +
    '<label class="field-label">Nombre del voluntario a cargo' +
    '<input type="text" id="loginVoluntario" placeholder="Tu nombre" maxlength="40"></label>' +
    "</div>";
  html += '<div class="close-corte-wrap">' +
    '<button class="link-btn" id="loginBack">‹ Elegir otro puesto</button>' +
    '<button class="btn-block" id="btnIngresar" style="margin-top:8px;">Ingresar</button>' +
    "</div>";
  root.innerHTML = html;
  document.getElementById("loginBack").addEventListener("click", function () { nav.loginTipo = null; render(); });
  document.getElementById("loginId").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") document.getElementById("loginVoluntario").focus();
  });
  document.getElementById("loginVoluntario").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") document.getElementById("btnIngresar").click();
  });
  document.getElementById("btnIngresar").addEventListener("click", function () {
    var idVal = document.getElementById("loginId").value.trim();
    var volVal = document.getElementById("loginVoluntario").value.trim();
    if (!idVal) { showToast("Ingresá un identificador para el puesto."); return; }

"use strict";

function cartQty(productId) {
  var line = nav.cart.filter(function (l) { return l.productId === productId; })[0];
  return line ? line.qty : 0;
}
function cartLines() {
  var st = state[nav.stand];
  return nav.cart.map(function (l) {
    var p = st.products.filter(function (x) { return x.id === l.productId; })[0];
    return { product: p, qty: l.qty, subtotal: p.price * l.qty };
  });
}
function cartTotal() { return cartLines().reduce(function (sum, l) { return sum + l.subtotal; }, 0); }
function cartCount() { return nav.cart.reduce(function (sum, l) { return sum + l.qty; }, 0); }

function poolById(st, id) {
  return (st.pools || []).filter(function (x) { return x.id === id; })[0];
}

// Unidades de un pool ya comprometidas por lo que hay en el carrito.
function poolReserved(poolId) {
  var st = state[nav.stand];
  var total = 0;
  nav.cart.forEach(function (l) {
    var p = st.products.filter(function (x) { return x.id === l.productId; })[0];
    if (p && p.recipe && p.recipe[poolId]) total += p.recipe[poolId] * l.qty;
  });
  return total;
}

// Cuántas unidades más de este producto se pueden agregar al carrito.
// null = sin límite de stock.
function productRemaining(st, p) {
  if (p.recipe) {
    var lim = Infinity;
    Object.keys(p.recipe).forEach(function (poolId) {
      var pool = poolById(st, poolId);
      if (pool && pool.controlled) lim = Math.min(lim, Math.floor((pool.stock - poolReserved(poolId)) / p.recipe[poolId]));
    });
    return lim === Infinity ? null : lim;
  }
  if (p.controlled) return p.stock - cartQty(p.id);
  return null;
}

// Chip de stock para la tarjeta de producto en la grilla: solo el número
// disponible y el color del estado. Sin control de stock -> sin chip.
function productStockLine(st, p) {
  var rem = productRemaining(st, p);
  if (rem === null) return "";
  var lvl;
  if (p.recipe) {
    lvl = "mucho";
    Object.keys(p.recipe).forEach(function (poolId) {
      var pool = poolById(st, poolId);
      if (pool && pool.controlled && LEVEL_ORDER[pool.level] < LEVEL_ORDER[lvl]) lvl = pool.level;
    });
  } else {
    lvl = p.level;
  }
  if (rem <= 0) lvl = "agotado";
  return '<span class="stock-chip stock-' + lvl + '">' + Math.max(0, rem) + "</span>";
}

function renderVenderGrid() {
  var st = state[nav.stand];
  var wrap = document.getElementById("grid");
  if (!wrap) return;
  wrap.innerHTML = "";
  st.products.forEach(function (p) {
    var rem = productRemaining(st, p);
    var disabled = rem !== null && rem <= 0;
    var qty = cartQty(p.id);
    var btn = document.createElement("button");
    btn.className = "tile";
    btn.type = "button";
    btn.dataset.id = p.id;
    if (disabled) btn.setAttribute("disabled", "disabled");
    btn.innerHTML =
      '<div class="tile-head"><span class="icon">' + p.icon + '</span>' +
      '<span class="name">' + p.name + "</span>" +
      (qty > 0 ? '<span class="cart-badge">' + qty + "</span>" : "") +
      "</div>" +
      '<div class="tile-foot"><span class="price">' + money(p.price) + "</span>" +
      productStockLine(st, p) + "</div>";
    btn.addEventListener("click", function () { addToCart(p.id); });
    wrap.appendChild(btn);
  });
}

function addToCart(productId) {
  var st = state[nav.stand];
  var p = st.products.filter(function (x) { return x.id === productId; })[0];
  if (!p) return;
  var rem = productRemaining(st, p);
  if (rem !== null && rem <= 0) { showToast("No hay stock para " + p.name + "."); return; }
  var line = nav.cart.filter(function (l) { return l.productId === productId; })[0];
  if (line) line.qty += 1; else nav.cart.push({ productId: productId, qty: 1 });
  renderVenderGrid();
  renderVenderCart();
}

function decLine(productId) {
  var line = nav.cart.filter(function (l) { return l.productId === productId; })[0];
  if (!line) return;
  line.qty -= 1;
  if (line.qty <= 0) nav.cart = nav.cart.filter(function (l) { return l.productId !== productId; });
  renderVenderGrid();
  renderVenderCart();
}

function renderVenderCart() {
  var wrap = document.getElementById("cartSection");
  if (!wrap) return;
  var lines = cartLines();
  if (!lines.length) { wrap.innerHTML = ""; return; }

  var html = '<div class="eyebrow">Carrito</div><div class="cart-list">';
  lines.forEach(function (l) {
    html += '<div class="cart-line"><span class="icon">' + l.product.icon + '</span><span class="name">' + l.product.name + '</span>' +
      '<span class="sub">' + money(l.subtotal) + '</span>' +
      '<span class="stepper"><button class="qty-btn" data-dec="' + l.product.id + '">–</button>' +
      '<span class="stock-num">' + l.qty + '</span>' +
      '<button class="qty-btn" data-inc="' + l.product.id + '">+</button></span></div>';
  });
  html += "</div>";

  html += '<div class="eyebrow">Método de pago</div><div class="pay-row" id="payRow">';
  payMethodsFor(nav.stand).forEach(function (m) {
    html += '<button type="button" class="pay-opt' + (nav.payMethod === m.id ? " sel" : "") + '" data-pay="' + m.id + '">' +
      '<span class="ic">' + (PAY_ICON[m.id] || "") + "</span>" + m.label + "</button>";
  });
  html += "</div>";

  html += '<div class="checkout-bar"><div class="info"><span class="n">' +
    cartCount() + " producto" + (cartCount() === 1 ? "" : "s") + "</span>" +
    '<span class="t">' + money(cartTotal()) + "</span></div>" +
    '<button class="go" id="btnVender"' + (nav.payMethod ? "" : " disabled") + ">Vender</button></div>";
  wrap.innerHTML = html;

  wrap.querySelectorAll("[data-inc]").forEach(function (b) {
    b.addEventListener("click", function () { addToCart(b.getAttribute("data-inc")); });
  });
  wrap.querySelectorAll("[data-dec]").forEach(function (b) {
    b.addEventListener("click", function () { decLine(b.getAttribute("data-dec")); });
  });
  wrap.querySelectorAll("[data-pay]").forEach(function (b) {
    b.addEventListener("click", function () {
      nav.payMethod = b.getAttribute("data-pay");
      renderVenderCart();
    });
  });
  var goBtn = document.getElementById("btnVender");
  if (goBtn) goBtn.addEventListener("click", function () {
    if (!cartLines().length || !nav.payMethod) return;
    var resumen = cartLines().map(function (l) {
      return l.product.name + (l.qty > 1 ? " ×" + l.qty : "");
    }).join(", ");
    var msg = "¿Confirmás la venta?\n\n" + resumen +
      "\nTotal: " + money(cartTotal()) +
      "\nPago: " + payLabel(nav.payMethod);
    if (!confirm(msg)) return;
    finalizeSale(nav.payMethod);
  });
}

function applySaleStock(st, it, sign) {
  var p = st.products.filter(function (x) { return x.id === it.productId; })[0];
  if (!p) return;
  p.sold += sign * it.qty;
  if (p.recipe) {
    Object.keys(p.recipe).forEach(function (poolId) {
      var pool = poolById(st, poolId);
      if (!pool || !pool.controlled) return;
      pool.stock = Math.max(0, pool.stock - sign * p.recipe[poolId] * it.qty);
      pool.level = levelFor(pool.stock, pool.thresholds);
    });
  } else if (p.controlled) {
    p.stock = Math.max(0, p.stock - sign * it.qty);
    p.level = levelFor(p.stock, p.thresholds);
  }
}

function finalizeSale(payMethodId) {
  var st = state[nav.stand];
  var lines = cartLines();
  if (!lines.length) return;
  var items = lines.map(function (l) {
    return { productId: l.product.id, name: l.product.name, qty: l.qty, price: l.product.price };
  });
  var total = cartTotal();
  items.forEach(function (it) { applySaleStock(st, it, 1); });
  st.totals.ventas += 1; st.totals[payMethodId] += total;
  st.cumulative.ventas += 1; st.cumulative[payMethodId] += total;
  st.log.push({ id: makeId("v"), time: nowLabel(), type: "venta", items: items, total: total, payMethod: payMethodId, voided: false });

  var low = [];
  items.forEach(function (it) {
    var p = st.products.filter(function (x) { return x.id === it.productId; })[0];
    if (!p) return;
    if (p.recipe) {
      Object.keys(p.recipe).forEach(function (poolId) {
        var pool = poolById(st, poolId);
        if (pool && pool.controlled && (pool.level === "critico" || pool.level === "agotado") && low.indexOf(pool.name) < 0) low.push(pool.name);
      });
    } else if (p.controlled && (p.level === "critico" || p.level === "agotado")) {
      if (low.indexOf(p.name) < 0) low.push(p.name);
    }
  });

  nav.cart = [];
  nav.payMethod = null;
  nav.screen = "vender";
  render();
  showToast("Venta registrada · " + money(total) + " · " + payLabel(payMethodId));
  if (low.length) {
    setTimeout(function () { showToast("⚠ Stock bajo: " + low.join(", ")); }, 2300);
  }
}

function voidSale(entry) {
  var st = state[nav.stand];
  entry.voided = true;
  st.totals.ventas -= 1; st.totals[entry.payMethod] -= entry.total;
  st.cumulative.ventas -= 1; st.cumulative[entry.payMethod] -= entry.total;
  entry.items.forEach(function (it) { applySaleStock(st, it, -1); });
  st.log.push({ time: nowLabel(), type: "anulacion", ventaId: entry.id || "", items: entry.items, total: entry.total });
}

      '<div style="font-size:12px;color:var(--text-muted);padding:6px 2px 0;line-height:1.4;">Lo que no retirés queda como caja inicial del próximo corte.</div>' +
      "</div>";
    html += '<button class="btn-block" id="btnCerrarCorte">Cerrar corte y empezar Corte ' + (st.corte + 1) + "</button></div>";

    var expected = st.cajaInicial + st.cumulative.efectivo;
    var counted = st.counted;
    html += '<div class="eyebrow">Resumen del puesto</div>';
    html += '<div class="cash-panel">' +
      '<div class="cash-row"><span class="k">Caja inicial del puesto</span><span class="v">' + money(st.cajaInicial) + "</span></div>" +
      '<div class="cash-row"><span class="k">Ventas en efectivo</span><span class="v">' + money(st.cumulative.efectivo) + "</span></div>" +
      '<div class="cash-row"><span class="k"><strong>Efectivo esperado</strong></span><span class="v">' + money(expected) + "</span></div>" +
      '<div class="cash-row"><span class="k">Transferencias</span><span class="v">' + money(st.cumulative.transferencia) + "</span></div>" +
      '<div class="cash-row"><span class="k">Tarjetas</span><span class="v">' + money(st.cumulative.tarjeta) + "</span></div>" +
      '<div class="cash-input-row"><span class="k">Efectivo contado</span><input type="number" id="contadoInput" placeholder="0" value="' + (counted === null ? "" : counted) + '"></div>';
    if (counted !== null) {
      var diff = counted - expected;
      var cls = diff === 0 ? "stock-mucho" : (diff > 0 ? "stock-medio" : "stock-critico");
      var label = diff === 0 ? "🟢 Caja exacta" : (diff > 0 ? "🟡 Sobrante " + money(diff) : "🔴 Faltante " + money(Math.abs(diff)));
      html += '<div class="cash-result ' + cls + '">' + label + "</div>";
    }
    html += "</div>";

    html += '<div class="close-corte-wrap">' +
      '<button class="btn-block" id="btnCerrarPuesto" style="background:var(--stock-critico);">Cerrar puesto</button>' +
      "</div>";

    html += '<div class="eyebrow">Sincronización con Sheets</div>';
    html += '<div class="cash-panel">' +
      '<div class="cash-row"><span class="k">Token de este puesto</span><span class="v" style="font-variant-numeric:normal;">' + puestoToken() + "</span></div>" +
      '<label class="field-label">URL del Web App (Apps Script) — ya viene configurada por defecto; solo tocá si necesitás apuntar a otra planilla' +
      '<input type="text" id="webAppUrlInput" placeholder="https://script.google.com/macros/s/AKfycb.../exec" value="' + (getWebAppUrl() || "") + '"></label>' +
      '<div class="cash-row"><span class="k">Pendientes de enviar</span><span class="v" id="pendingCountLbl">' + pendingCount() + "</span></div>" +
      '<div style="display:flex;gap:8px;margin-top:10px;">' +
      '<button class="btn-block" id="btnSaveWebAppUrl" style="flex:1;">Guardar URL</button>' +
      '<button class="btn-block" id="btnRetrySync" style="flex:1;background:var(--surface-sunken);color:var(--text);border:1px solid var(--border);">Reintentar ahora</button>' +
      "</div></div>";
  }

  body.innerHTML = html;

  var toggleMovBtn = document.getElementById("btnToggleMovimientos");
  if (toggleMovBtn) {
    toggleMovBtn.addEventListener("click", function () {
      nav.cajaMovimientosExpanded = !nav.cajaMovimientosExpanded;
      renderCajaBody();
    });
  }

  var closingRetiroInput = document.getElementById("corteRetiroInput");
  if (closingRetiroInput && nav.closingPuesto) {
    closingRetiroInput.addEventListener("input", function () {
      var badge = document.getElementById("cierreDiffBadge");
      var raw = closingRetiroInput.value.trim();
      var v = parseFloat(raw);
      if (raw === "" || isNaN(v)) { badge.innerHTML = ""; return; }
      var diff = v - esperadoCierre;
      var cls = diff === 0 ? "stock-mucho" : (diff > 0 ? "stock-medio" : "stock-critico");
      var label = diff === 0 ? "🟢 Caja exacta" : (diff > 0 ? "🟡 Sobrante " + money(diff) : "🔴 Faltante " + money(Math.abs(diff)));
      badge.innerHTML = '<div class="cash-result ' + cls + '">' + label + "</div>";
    });
  }

  document.getElementById("btnCerrarCorte").addEventListener("click", function () {
    var esperado = st.corteCajaInicial + st.totals.efectivo;
    var retiroInput = document.getElementById("corteRetiroInput");
    var retiro;
    if (nav.closingPuesto) {
      var retiroRaw = retiroInput.value.trim();
      retiro = parseFloat(retiroRaw);
      if (retiroRaw === "" || isNaN(retiro) || retiro < 0) {
        showToast("Ingresá el efectivo que retirás antes de cerrar el puesto.");
        return;
      }
    } else {
      retiro = parseFloat(retiroInput.value);
      if (isNaN(retiro) || retiro < 0) retiro = 0;
    }
    var contado = nav.closingPuesto ? retiro : esperado;
    if (retiro > contado) { showToast("El retiro no puede ser mayor al efectivo contado."); return; }
    var queda = contado - retiro;
    var cierreTime = new Date().toISOString();
    var diferencia = esperado - contado;
    st.cumulative.retirado = (st.cumulative.retirado || 0) + retiro;
    var payload = buildCortePayload(st, contado, esperado, diferencia, cierreTime, retiro, queda);

    if (nav.closingPuesto) {
      var confirmMsg = "¿Estás seguro que querés cerrar el puesto \"" + session.identificador +
        "\"?\n\nEs una decisión importante: no se puede deshacer, y para seguir vendiendo vas a tener que volver a identificarte.";
      if (!confirm(confirmMsg)) return;
      payload.cierrePuesto = buildCierrePuestoPayload(st, contado, retiro, cierreTime);
      enqueuePayload(payload);
      flushQueue();
      clearState(session.tipo, session.identificador);
      showToast("Puesto cerrado" + (retiro > 0 ? " · retiraste " + money(retiro) : "") + ".");
      switchPuesto();
      return;
    }

    enqueuePayload(payload);
    flushQueue();
    st.corte += 1;
    st.corteCajaInicial = queda;
    st.corteApertura = cierreTime;
    st.totals = { ventas: 0, efectivo: 0, transferencia: 0, tarjeta: 0, otro: 0 };
    st.log = [];
    showToast("Corte cerrado" + (retiro > 0 ? " · retiraste " + money(retiro) : "") + ". Empezó el Corte " + st.corte + ".");
    render();
  });

  var cerrarPuestoBtn = document.getElementById("btnCerrarPuesto");
  if (cerrarPuestoBtn) {
    cerrarPuestoBtn.addEventListener("click", function () {
      if (!st.setupDone) { switchPuesto(); return; }
      nav.closingPuesto = true;
      render();
      showToast("Contá el efectivo arriba y confirmá para cerrar el puesto.");
    });
  }

  var saveUrlBtn = document.getElementById("btnSaveWebAppUrl");
  if (saveUrlBtn) {
    saveUrlBtn.addEventListener("click", function () {
      var v = document.getElementById("webAppUrlInput").value.trim();
      setWebAppUrl(v);
      showToast(v ? "URL guardada." : "URL borrada.");
      var pendingBefore = pendingCount();
      flushQueue().then(function () {
        if (pendingBefore > 0) {
          showToast(pendingCount() === 0 ? "Sincronización al día." : "Todavía no se pudo sincronizar. Revisá la URL o la conexión.");
        }
      });
    });
  }
  var retryBtn = document.getElementById("btnRetrySync");
  if (retryBtn) {
    retryBtn.addEventListener("click", function () {
      if (!pendingCount()) { showToast("No hay cortes pendientes."); return; }
      showToast("Reintentando sincronización...");
      flushQueue().then(function () {
        showToast(pendingCount() === 0 ? "Sincronización al día." : "Todavía no se pudo sincronizar. Revisá la URL o la conexión.");
      });
    });
  }
  var contadoInput = document.getElementById("contadoInput");
  if (contadoInput) {
    contadoInput.addEventListener("change", function () {
      var v = parseFloat(contadoInput.value);
      st.counted = isNaN(v) ? null : v;
      saveState();
      renderCajaBody();
    });
  }
}

"use strict";

function renderSeteoStock() {
  var s = STANDS[nav.stand];
  var st = state[nav.stand];
  nav.stockExpanded = nav.stockExpanded || {};
  var html = header("Stock", s.label);

  var pools = st.pools || [];
  if (pools.length) {
    html += '<div class="eyebrow">Stock del puesto</div>';
    pools.forEach(function (p) {
      html += '<div class="set-row" data-id="' + p.id + '">';
      html += '<div class="head">' +
        '<span class="icon">' + p.icon + '</span>' +
        '<div class="name-stock"><span class="name">' + p.name + '</span>' + stockLine(p) + "</div>" +
        "</div>";
      html += '<div class="mini-toggle" style="margin-top:10px;"><span class="lbl">Controlar stock</span>' +
        '<button class="switch" data-pool-switch="' + p.id + '" data-on="' + p.controlled + '"></button></div>';
      if (p.controlled) {
        html += '<div class="stock-controls" style="margin-top:10px;justify-content:flex-start;">' +
          '<span class="qty-group">' +
          '<button class="qty-btn" data-repo-pool="' + p.id + '" data-delta="-1">–</button>' +
          '<input type="number" min="0" step="1" class="qty-num-input" value="' + p.stock + '" data-stock-input-pool="' + p.id + '">' +
          '<button class="qty-btn" data-repo-pool="' + p.id + '" data-delta="1">+</button>' +
          '<button class="qty-btn" data-repo-pool="' + p.id + '" data-delta="10">+10</button>' +
          "</span></div>";
      }
      html += "</div>";
    });
  }

  html += '<div class="eyebrow">Productos</div>';
  st.products.forEach(function (p) {
    var expanded = !!nav.stockExpanded[p.id];
    html += '<div class="set-row" data-id="' + p.id + '">';
    html += '<div class="head" data-toggle-expand="' + p.id + '">' +
      '<span class="icon">' + p.icon + '</span>' +
      '<div class="name-stock"><span class="name">' + p.name + '</span>' +
      (p.recipe ? recipeLine(st, p) : stockLine(p)) + "</div>" +
      '<span class="price-display">' + money(p.price) + '</span>' +
      '<span class="expand-chev">' + (expanded ? "▲" : "▾") + '</span>' +
      "</div>";
    if (expanded) {
      html += '<div class="stock-edit">';
      html += '<div class="mini-toggle"><span class="lbl">Precio</span>' +
        '<span class="price-field">$<input type="number" min="0" step="100" value="' + p.price + '" data-price="' + p.id + '"></span></div>';
      if (!p.recipe) {
        html += '<div class="mini-toggle" style="margin-top:10px;"><span class="lbl">Controlar stock de este producto</span>' +
          '<button class="switch" data-prod-switch="' + p.id + '" data-on="' + p.controlled + '"></button></div>';
      }
      if (!p.recipe && p.controlled) {
        html += '<div class="stock-controls" style="margin-top:10px;justify-content:flex-start;">' +
          '<span class="qty-group">' +
          '<button class="qty-btn" data-repo="' + p.id + '" data-delta="-1">–</button>' +
          '<input type="number" min="0" step="1" class="qty-num-input" value="' + p.stock + '" data-stock-input="' + p.id + '">' +
          '<button class="qty-btn" data-repo="' + p.id + '" data-delta="1">+</button>' +
          '<button class="qty-btn" data-repo="' + p.id + '" data-delta="10">+10</button>' +
          "</span></div>";
      }
      html += "</div>";
    }
    html += "</div>";
  });

  html += '<div class="eyebrow">Movimientos de stock — Corte ' + st.corte + "</div>";
  html += '<div class="op-list">';
  var stockLog = st.log.filter(function (op) { return op.type === "reposicion"; });
  if (!stockLog.length) {
    html += '<div class="op-empty">Todavía no hay movimientos de stock en este corte.</div>';
  } else {
    stockLog.slice().reverse().forEach(function (op) { html += opRowHtml(op, null, false); });
  }
  html += "</div>";

  root.innerHTML = html;
  bindBack(function () { nav.screen = "menu"; render(); });

  root.querySelectorAll("[data-toggle-expand]").forEach(function (h) {
    h.addEventListener("click", function () {
      var id = h.getAttribute("data-toggle-expand");
      nav.stockExpanded[id] = !nav.stockExpanded[id];
      render();
    });
  });
  root.querySelectorAll("[data-prod-switch]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var p = st.products.filter(function (x) { return x.id === btn.getAttribute("data-prod-switch"); })[0];
      p.controlled = !p.controlled;
      render();
      showToast("Control de stock " + (p.controlled ? "activado" : "desactivado") + " para " + p.name + ".");
    });
  });
  root.querySelectorAll("[data-pool-switch]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var p = (st.pools || []).filter(function (x) { return x.id === btn.getAttribute("data-pool-switch"); })[0];
      p.controlled = !p.controlled;
      render();
      showToast("Control de stock " + (p.controlled ? "activado" : "desactivado") + " para " + p.name + ".");
    });
  });
  root.querySelectorAll("[data-price]").forEach(function (inp) {
    inp.addEventListener("change", function () {
      var p = st.products.filter(function (x) { return x.id === inp.getAttribute("data-price"); })[0];
      var val = parseFloat(inp.value);
      if (!isNaN(val) && val >= 0) { p.price = val; saveState(); showToast("Precio de " + p.name + " actualizado a " + money(val) + "."); }
      else { inp.value = p.price; }
    });
  });

  function applyStockChange(p, newStock) {
    var delta = newStock - p.stock;
    if (delta === 0) return;
    p.stock = newStock;
    p.level = levelFor(p.stock, p.thresholds);
    st.log.push({ time: nowLabel(), type: "reposicion", name: p.name, delta: delta, stockResultante: p.stock });
    render();
    showToast((delta > 0 ? "+" : "") + delta + " " + p.name + " (" + p.stock + ").");
  }

  function bindRepo(btnAttr, inputAttr, list) {
    root.querySelectorAll("[" + btnAttr + "]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var p = list.filter(function (x) { return x.id === btn.getAttribute(btnAttr); })[0];
        var delta = parseInt(btn.getAttribute("data-delta"), 10);
        if (delta < 0 && p.stock <= 0) return;
        applyStockChange(p, Math.max(0, p.stock + delta));
      });
    });
    root.querySelectorAll("[" + inputAttr + "]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var p = list.filter(function (x) { return x.id === inp.getAttribute(inputAttr); })[0];
        var val = parseInt(inp.value, 10);
        if (isNaN(val) || val < 0) { inp.value = p.stock; return; }
        applyStockChange(p, val);
      });
    });
  }
  bindRepo("data-repo-pool", "data-stock-input-pool", st.pools || []);
  bindRepo("data-repo", "data-stock-input", st.products);
}

// Resumen legible de la receta de un combo (de qué pools descuenta).
function recipeLine(st, p) {
  var parts = Object.keys(p.recipe).map(function (poolId) {
    var pool = (st.pools || []).filter(function (x) { return x.id === poolId; })[0];
    return p.recipe[poolId] + "× " + (pool ? pool.name : poolId);
  });
  return '<span class="stock-line stock-sin"><span class="dot"></span>Usa ' + parts.join(" + ") + "</span>";
}

"use strict";

if (session) {
  var persistedState = loadState(session.tipo, session.identificador);
  if (validPersistedState(persistedState)) state[session.tipo] = persistedState;
}

var nav = {
  screen: session ? (state[session.tipo].setupDone ? "menu" : "setup") : "login",
  stand: session ? session.tipo : null,
  cart: [], payMethod: null, loginTipo: null, closingPuesto: false, cajaMovimientosExpanded: false, stockExpanded: {}
};
var root = document.getElementById("app");
var toastEl = document.getElementById("toast");
var toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
}

function render() {
  saveState();
  document.body.dataset.stand = nav.screen === "login" ? (nav.loginTipo || "") : (nav.stand || "");
  if (nav.screen === "login") return renderLogin();
  if (nav.screen === "menu") return renderMenu();
  if (nav.screen === "setup") return renderSetup();
  if (nav.screen === "vender") return renderVender();
  if (nav.screen === "caja") return renderCaja();
  if (nav.screen === "seteoStock") return renderSeteoStock();
}

function bindBack(fn) {
  var b = document.getElementById("backBtn");
  if (b) b.addEventListener("click", fn);
}

function switchPuesto() {
  localStorage.removeItem(SESSION_KEY);
  session = null;
  nav.stand = null;
  nav.screen = "login";
  nav.loginTipo = null;
  nav.closingPuesto = false;
  render();
}

"use strict";

document.getElementById("syncBadge").addEventListener("click", function () {
  showToast("Reintentando sincronización...");
  flushQueue();
});
updateSyncBadge();
flushQueue();
render();
</script>
